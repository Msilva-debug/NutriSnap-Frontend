<div class="flex h-screen bg-gray-50">
  <!-- Top bar (solo mobile) -->
  <header
    class="md:hidden fixed top-0 left-0 right-0 z-30 h-14 bg-primary-700 text-white flex items-center gap-3 px-4 shadow-md"
  >
    <button
      (click)="toggleSidebar()"
      class="p-2 rounded-lg hover:bg-primary-600 transition-colors cursor-pointer"
      aria-label="Abrir menú"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    </button>
    <app-rabbit-icon size="sm" />
    <span class="font-bold text-lg">CalorieTrack</span>
  </header>

  <!-- Backdrop (mobile) -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-40 bg-black/50 md:hidden" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar wrapper -->
  <div
    class="fixed inset-y-0 left-0 z-50 transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
    [ngClass]="sidebarOpen() ? 'translate-x-0' : '-translate-x-full'"
  >
    <app-sidebar (closeRequested)="closeSidebar()" />
  </div>

  <!-- Contenido principal -->
  <main class="app-scrollbar flex-1 overflow-auto pt-14 md:pt-0">
    <router-outlet></router-outlet>
  </main>
</div>
