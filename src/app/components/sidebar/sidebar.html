<aside class="w-64 bg-primary-700 text-white h-full min-h-screen shadow-lg flex flex-col">
  <!-- Header -->
  <div class="p-6 border-b border-primary-600">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <app-rabbit-icon size="md" />
        <div>
          <h1 class="text-xl font-bold">CalorieTrack</h1>
          <p class="text-xs text-primary-200">Nutrición diaria</p>
        </div>
      </div>
      <!-- Botón cerrar (solo mobile) -->
      <button
        (click)="close()"
        class="md:hidden p-1.5 rounded-lg hover:bg-primary-600 transition-colors cursor-pointer"
        aria-label="Cerrar menú"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-2">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-primary-600"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-primary-600 transition font-medium"
    >
      <span>📊</span>
      Panel
    </a>

    <div routerLinkActive="is-active" #mealsActive="routerLinkActive">
      <button
        type="button"
        (click)="toggleMealsMenu()"
        class="flex w-full items-center justify-between gap-3 rounded-lg px-4 py-3 font-medium transition hover:bg-primary-600"
        [class.bg-primary-600]="mealsMenuOpen() || mealsActive.isActive"
        aria-label="Abrir menú de comidas"
        [attr.aria-expanded]="mealsMenuOpen() || mealsActive.isActive"
      >
        <span class="flex items-center gap-3">
          <span>🍽️</span>
          Comidas
        </span>
        <svg
          class="h-4 w-4 transition-transform"
          [class.rotate-180]="mealsMenuOpen() || mealsActive.isActive"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>

      @if (mealsMenuOpen() || mealsActive.isActive) {
        <div class="mt-2 space-y-1 pl-8">
          <a
            routerLink="/meals/add"
            routerLinkActive="bg-primary-600 text-white"
            (click)="close()"
            class="flex items-center gap-3 rounded-lg px-4 py-2.5 text-sm font-medium text-primary-100 transition hover:bg-primary-600 hover:text-white"
          >
            <span>➕</span>
            Agregar comida
          </a>

          <a
            routerLink="/meals/history"
            routerLinkActive="bg-primary-600 text-white"
            (click)="close()"
            class="flex items-center gap-3 rounded-lg px-4 py-2.5 text-sm font-medium text-primary-100 transition hover:bg-primary-600 hover:text-white"
          >
            <span>📋</span>
            Historial de comidas
          </a>
        </div>
      }
    </div>

    <a
      routerLink="/recommendations"
      routerLinkActive="bg-primary-600"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-primary-600 transition font-medium"
    >
      <span>💡</span>
      Recomendaciones
    </a>

    <a
      routerLink="/configuration"
      routerLinkActive="bg-primary-600"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-primary-600 transition font-medium"
    >
      <span>⚙️</span>
      Configuración
    </a>
  </nav>

  <!-- Logout -->
  <div class="p-4 border-t border-primary-900">
    <button
      (click)="logout()"
      class="cursor-pointer w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-primary-900 hover:bg-primary-900 transition font-semibold"
    >
      <span>🚪</span>
      Salir
    </button>
  </div>
</aside>
