<div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
  <h3 class="text-lg font-semibold text-gray-800 mb-4">📝 Registrar Comida</h3>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Comida</label>
        <input
          type="text"
          formControlName="name"
          placeholder="Ej: Desayuno con café"
          class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary-400 transition\"
          [class.border-red-400]="name.invalid && name.touched"
        />
        @if (name.invalid && name.touched) {
          <p class="text-red-500 text-xs mt-1">Mínimo 3 caracteres.</p>
        }
      </div>

      <!-- Calorías -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Calorías</label>
        <input
          type="number"
          formControlName="calories"
          placeholder="500"
          class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary-400 transition"
          [class.border-red-400]="calories.invalid && calories.touched"
        />
      </div>

      <!-- Hora -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Hora</label>
        <input
          type="time"
          formControlName="time"
          class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary-400 transition"
          [class.border-red-400]="time.invalid && time.touched"
        />
      </div>

      <!-- Tipo de comida -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Tipo</label>
        <select
          formControlName="type"
          class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary-400 transition bg-white"
        >
          @for (option of mealTypeOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Botón -->
    <button
      type="submit"
      [disabled]="loading()"
      class="w-full bg-primary-500 hover:bg-primary-600 disabled:opacity-60 text-primary-contrast font-semibold py-2 rounded-lg transition cursor-pointer"
    >
      @if (loading()) {
        Guardando...
      } @else {
        Agregar comida
      }
    </button>
  </form>
</div>
