@if (selectable()) {
  <button
    type="button"
    (click)="preparationSelected.emit(preparation())"
    [class]="cardClasses()"
  >
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </button>
} @else {
  <article [class]="cardClasses()">
    <ng-container [ngTemplateOutlet]="content"></ng-container>

    @if (showActions()) {
      <div class="mt-4 grid grid-cols-2 gap-2">
        <button
          type="button"
          (click)="detailRequested.emit(preparation())"
          [disabled]="isLoadingAction()"
          class="inline-flex items-center justify-center gap-2 rounded-lg border border-gray-200 px-3 py-2 text-xs font-semibold text-gray-600 transition hover:border-gray-300 disabled:cursor-not-allowed disabled:text-gray-300"
        >
          @if (loadingDetail()) {
            <app-loading-spinner />
            Cargando...
          } @else {
            Ver detalle
          }
        </button>
        <button
          type="button"
          (click)="editRequested.emit(preparation())"
          [disabled]="isLoadingAction()"
          class="inline-flex items-center justify-center gap-2 rounded-lg border border-gray-200 px-3 py-2 text-xs font-semibold text-gray-600 transition hover:border-gray-300 disabled:cursor-not-allowed disabled:text-gray-300"
        >
          @if (loadingEdit()) {
            <app-loading-spinner />
            Cargando...
          } @else {
            Editar
          }
        </button>
        <button
          type="button"
          (click)="deactivateRequested.emit(preparation())"
          [disabled]="deactivating()"
          class="col-span-2 inline-flex items-center justify-center gap-2 rounded-lg border border-red-100 px-3 py-2 text-xs font-semibold text-red-600 transition hover:bg-red-50 disabled:cursor-not-allowed disabled:text-red-300"
        >
          @if (deactivating()) {
            <app-loading-spinner />
            Desactivando...
          } @else {
            Desactivar preparación
          }
        </button>
      </div>
    }
  </article>
}

<ng-template #content>
  @let item = preparation();
  <div class="flex items-start justify-between gap-3">
    <div>
      <h3 class="font-bold text-gray-800">{{ item.name }}</h3>
      <p class="mt-1 text-xs text-gray-400">{{ item.servings }} porciones</p>
    </div>
    <span class="rounded-full bg-primary-50 px-2.5 py-1 text-xs font-bold text-primary-600">
      {{ item.caloriesPerServing }} kcal
    </span>
  </div>

  <div class="mt-3 grid grid-cols-3 gap-2 text-center">
    <div class="rounded-lg bg-blue-50 px-2 py-2">
      <p class="text-[11px] font-semibold text-blue-600">Prot.</p>
      <p class="text-sm font-bold text-blue-800">{{ item.proteinsPerServing }}g</p>
    </div>
    <div class="rounded-lg bg-orange-50 px-2 py-2">
      <p class="text-[11px] font-semibold text-orange-600">Carbos</p>
      <p class="text-sm font-bold text-orange-800">{{ item.carbsPerServing }}g</p>
    </div>
    <div class="rounded-lg bg-yellow-50 px-2 py-2">
      <p class="text-[11px] font-semibold text-yellow-700">Grasas</p>
      <p class="text-sm font-bold text-yellow-800">{{ item.fatsPerServing }}g</p>
    </div>
  </div>
</ng-template>
