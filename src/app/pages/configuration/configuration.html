<div class="min-h-screen bg-gray-50 p-4 md:p-6">
  <div class="mx-auto max-w-5xl space-y-6">
    <header class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">Configuración</h1>
        <p class="mt-1 text-gray-500">Apariencia de tu cuenta</p>
      </div>
    </header>

    <section class="rounded-xl bg-white p-5 shadow-md md:p-6">
      <div class="space-y-4">
        <app-theme-customizer
          [theme]="themeDraft()"
          (themeChange)="updateThemeDraft($event)"
        />

        @if (successMsg()) {
          <div class="rounded-xl bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-700">
            {{ successMsg() }}
          </div>
        }

        @if (errorMsg()) {
          <div class="rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
            {{ errorMsg() }}
          </div>
        }

        <div class="flex flex-col gap-3 sm:flex-row">
          <button
            type="button"
            (click)="saveTheme()"
            [disabled]="saving() || !hasChanges()"
            class="inline-flex flex-1 cursor-pointer items-center justify-center rounded-xl bg-primary-500 px-4 py-3 text-sm font-bold text-primary-contrast shadow-md transition hover:bg-primary-600 disabled:cursor-not-allowed disabled:opacity-60"
          >
            @if (saving()) {
              Guardando...
            } @else {
              Guardar cambios
            }
          </button>

          <button
            type="button"
            (click)="restoreCurrentTheme()"
            [disabled]="saving() || !hasChanges()"
            class="inline-flex flex-1 cursor-pointer items-center justify-center rounded-xl border border-gray-200 px-4 py-3 text-sm font-bold text-gray-600 transition hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-60"
          >
            Restaurar
          </button>
        </div>
      </div>
    </section>
  </div>
</div>
