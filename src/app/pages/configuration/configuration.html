<div class="min-h-full bg-gray-50">
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-4 py-5 sm:px-6 lg:px-8">
    <header class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold text-primary-600">Configuración</p>
        <h1 class="mt-1 text-3xl font-bold text-gray-950">Cuenta y apariencia</h1>
        <p class="mt-2 text-sm text-gray-500">Ajusta la experiencia visual sin salir del flujo de seguimiento.</p>
      </div>
    </header>

    <section class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm sm:p-6">
      <div class="space-y-4">
        <app-theme-customizer
          [theme]="themeDraft()"
          (themeChange)="updateThemeDraft($event)"
        />

        @if (successMsg()) {
          <div class="rounded-lg border border-emerald-100 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-700">
            {{ successMsg() }}
          </div>
        }

        @if (errorMsg()) {
          <div class="rounded-lg border border-red-100 bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
            {{ errorMsg() }}
          </div>
        }

        <div class="flex flex-col gap-3 sm:flex-row">
          <button
            type="button"
            (click)="saveTheme()"
            [disabled]="saving() || !hasChanges()"
            class="inline-flex flex-1 cursor-pointer items-center justify-center gap-2 min-h-11 rounded-lg bg-primary-500 px-4 py-3 text-sm font-bold text-primary-contrast shadow-md transition hover:bg-primary-600 disabled:cursor-not-allowed disabled:opacity-60"
          >
            @if (saving()) {
              <app-loading-spinner />
              Guardando...
            } @else {
              Guardar cambios
            }
          </button>

          <button
            type="button"
            (click)="restoreCurrentTheme()"
            [disabled]="saving() || !hasChanges()"
            class="inline-flex flex-1 cursor-pointer items-center justify-center min-h-11 rounded-lg border border-gray-200 px-4 py-3 text-sm font-bold text-gray-600 transition hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-60"
          >
            Restaurar
          </button>
        </div>
      </div>
    </section>
  </div>
</div>
