<aside class="w-64 bg-primary-700 text-white h-full min-h-screen shadow-lg flex flex-col">

  <!-- Header -->
  <div class="p-6 border-b border-primary-600">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🥦</span>
        <div>
          <h1 class="text-xl font-bold">CalorieTrack</h1>
          <p class="text-xs text-primary-200">Nutrición diaria</p>
        </div>
      </div>
      <!-- Botón cerrar (solo mobile) -->
      <button
        (click)="close()"
        class="md:hidden p-1.5 rounded-lg hover:bg-primary-600 transition-colors"
        aria-label="Cerrar menú"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-2">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-primary-600"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-primary-600 transition font-medium"
    >
      <span>📊</span>
      Dashboard
    </a>

    <a
      routerLink="/meals/add"
      routerLinkActive="bg-primary-600"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-primary-600 transition font-medium"
    >
      <span>➕</span>
      Agregar Comida
    </a>

    <a
      routerLink="/meals/history"
      routerLinkActive="bg-primary-600"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-primary-600 transition font-medium"
    >
      <span>📋</span>
      Historial
    </a>

    <a
      routerLink="/settings"
      routerLinkActive="bg-primary-600"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-primary-600 transition font-medium"
    >
      <span>⚙️</span>
      Configuración
    </a>
  </nav>

  <!-- Logout -->
  <div class="p-4 border-t border-primary-600">
    <button
      (click)="logout()"
      class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-red-600 hover:bg-red-700 transition font-semibold"
    >
      <span>🚪</span>
      Salir
    </button>
  </div>

</aside>
